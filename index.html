<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Muay Thai Quiz</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="imagens/lutadorMT.png">

</head>

<body>

    <header>

        <h1>🥊 Muay Thai Quiz</h1>

        <p>Escolha a defesa correta para cada golpe.</p>

    </header>

    <section id="principal">

        <div id="golpe">

            <div id="ataque">

                <h2 id="txtGolpe">
                    Clique em Iniciar
                </h2>

                <img
                    id="imgGolpe"
                    src="imagens/logo.png"
                    alt="Imagem do golpe">

            </div>

            <div id="defesaCorreta">

                <p id="txtDefesa">
                    Defesa Correta
                </p>

                <img
                    id="imgDefesa"
                    src="imagens/logo.png"
                    alt="Imagem da defesa">

            </div>

        </div>

        <div id="defesas">

            <p>Qual é a melhor defesa?</p>

            <label>
                <input type="radio" name="defesa" value="Check">
                Check
            </label>

            <label>
                <input type="radio" name="defesa" value="Bloqueio Alto">
                Bloqueio Alto
            </label>

            <label>
                <input type="radio" name="defesa" value="Esquiva">
                Esquiva
            </label>

            <label>
                <input type="radio" name="defesa" value="Desvio Lateral">
                Desvio Lateral
            </label>

        </div>

        <div id="resultado">

            <p id="msgResultado"></p>

        </div>

        <div id="areaBotoes">

            <input
                type="button"
                value="Iniciar"
                id="btnIniciar"
                onclick="iniciar()">

            <input
                type="button"
                value="Responder"
                id="btnResponder"
                onclick="responder()">

        </div>

    </section>

    <footer>

        <p>&copy; 2026 - Desenvolvido por Marcia Xavier</p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
